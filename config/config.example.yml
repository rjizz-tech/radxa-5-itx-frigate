mqtt:
  enabled: true
  host: "{FRIGATE_MQTT_HOST}"
  port: 1883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"
  topic_prefix: frigate
  client_id: radxa_frigate

tls:
  enabled: true

detectors:
  ax_m1:
    type: axengine
    manifest: /models/manifest.json
    axcl_model: yolov9

model:
  path: /models/frigate-yolov9-tiny.axmodel
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nhwc
  input_dtype: int
  input_pixel_format: bgr
  labelmap_path: /labelmap/coco-80.txt

ffmpeg:
  hwaccel_args: preset-rkmpp

objects:
  track: [person, car, cat, dog]

face_recognition:
  enabled: true
  backend: axcl
  model_size: large
  axcl_manifest: /models/manifest.json
  axcl_wait_ms: 20
  recognition_threshold: 0.9
  min_faces: 2
  save_attempts: 100

semantic_search:
  enabled: false

record:
  enabled: true
  continuous:
    days: 7
  alerts:
    retain: {days: 7, mode: all}
  detections:
    retain: {days: 7, mode: all}

snapshots:
  enabled: true
  retain: {default: 7}

go2rtc:
  rtsp:
    username: viewer
    password: "{FRIGATE_RESTREAM_PASSWORD}"
  streams:
    wyze_test:
      - "rtsp://{FRIGATE_RTSP_URL_USER}:{FRIGATE_RTSP_URL_PASSWORD}@{FRIGATE_RTSP_HOST}:554/live"
  # Set candidates to the board's reachable LAN/VPN IP for WebRTC.

cameras:
  wyze_test:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://viewer:{FRIGATE_RESTREAM_URL_PASSWORD}@127.0.0.1:8554/wyze_test
          input_args: preset-rtsp-restream
          roles: [detect, record]
    detect:
      width: 1280
      height: 720
      fps: 5
    live:
      streams:
        Main: wyze_test
